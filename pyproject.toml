[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-renderer"
version = "1.0.0"
description = "Automated video rendering with intro/loop composition"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[project.scripts]
video-renderer = "video_renderer.main:main"

[tool.setuptools.packages.find]
include = ["video_renderer*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.1",
    "freezegun>=1.2",
    "bandit>=1.7",
    "safety>=2.3",
    "pip-audit>=2.5",
    "pytest-benchmark>=4.0",
    "coverage[toml]>=7.0",
]
