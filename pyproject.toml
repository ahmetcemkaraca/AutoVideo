[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-renderer"
version = "1.0.0"
description = "Automated video rendering with intro/loop composition"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[project.scripts]
video-renderer = "video_renderer.main:main"

[tool.setuptools.packages.find]
include = ["video_renderer*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.1",
    "freezegun>=1.2",
    "bandit>=1.7",
    "safety>=2.3",
    "pip-audit>=2.5",
    "pytest-benchmark>=4.0",
    "coverage[toml]>=7.0",
    "ruff>=0.3.0",
    "black>=24.0",
    "isort>=5.13",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["video_renderer", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside exception handler
    "ARG001", # unused function argument (common in callbacks)
    "ARG002", # unused method argument (common in overrides)
]

[tool.ruff.lint.isort]
known-first-party = ["video_renderer"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["video_renderer"]