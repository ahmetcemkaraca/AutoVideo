[pytest]
# Pytest configuration for AutoVideo test suite

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --cov=video_renderer
    --cov=VideoAutomation
    --cov=VideoLivestream
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    -v
    -ra
    --showlocals
    --tb=short
    --strict-markers

# Minimum version
minversion = 7.0

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external resources)
    e2e: End-to-end tests (slowest, full workflow)
    performance: Performance benchmarks
    slow: Slow-running tests
    ffmpeg: Tests requiring FFmpeg to be installed
    youtube: Tests requiring YouTube API credentials
    gpu: Tests requiring GPU acceleration
    network: Tests requiring network access
    posix: POSIX-specific tests (skip on Windows)
    windows: Windows-specific tests (skip on POSIX)

# Filter warnings
filterwarnings =
    # Ignore deprecation warnings from dependencies
    ignore::DeprecationWarning

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */dist-packages/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 80

exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if DEBUG:
    @abstractmethod
    : ClassVar[
    \.\.\.

[coverage:html]
directory = htmlcov
