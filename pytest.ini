[pytest]
# Pytest configuration for AutoVideo test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Show slowest tests
    --durations=10

# Markers
markers =
    requires_ffmpeg: Tests that require FFmpeg to be installed
    slow: Slow-running tests (integration tests)
    integration: Integration tests
    unit: Unit tests
    threading: Tests related to thread-safety

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
